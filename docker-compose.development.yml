name: hadoum-development

# Deployed "development" environment: same optimized images as production
# (no bind mounts, no hot reload), but fully isolated from production and
# from any developer's local machine. This is the automatic deploy target
# for merges into `develop` (see .github/workflows/cd.yml).

services:
  postgres:
    image: postgres:16-alpine
    container_name: hadoum-postgres-development
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.development}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.development}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.development}
    volumes:
      - hadoum_postgres_development_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hadoum_development_user} -d ${POSTGRES_DB:-hadoum_development_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hadoum-network-development

  api:
    build:
      context: ./hadoum_api
    image: ${API_IMAGE:-hadoum-api}:${IMAGE_TAG:-latest}
    container_name: hadoum-api-development
    environment:
      NODE_ENV: production
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env.development}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-eu-central}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://dev.hadoum.com}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hadoum-network-development

  frontend:
    build:
      context: ./hadoum_frontend
    image: ${FRONTEND_IMAGE:-hadoum-frontend}:${IMAGE_TAG:-latest}
    container_name: hadoum-frontend-development
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-dev.hadoum.com}
      NGINX_CERT_DOMAIN: ${NGINX_CERT_DOMAIN:-dev.hadoum.com}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ${TLS_CERT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hadoum-network-development

networks:
  hadoum-network-development:
    name: hadoum-network-development

volumes:
  hadoum_postgres_development_data:
    name: hadoum-postgres-development-data
