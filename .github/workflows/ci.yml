name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No "engines" field in either package.json. 22 is the version actually
  # used by this project (hadoum_api/Dockerfile and hadoum_frontend/Dockerfile
  # both pin FROM node:22-alpine).
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (hadoum_api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hadoum_api
    env:
      # Placeholder only, no live database. prisma.config.ts reads
      # DATABASE_URL to resolve its datasource config even for offline
      # commands (generate/validate), so it must be set to something.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/hadoum_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hadoum_api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      # "lint" exists but runs eslint --fix, which rewrites files - not
      # appropriate for a check-only CI gate. "lint:check" (same rules,
      # no --fix) already exists in package.json, so it is used here
      # instead of inventing a new script.
      - name: Lint (lint:check)
        run: npm run lint:check

      # Unit tests (Jest, mocked PrismaService — no live database needed)
      # with coverage + the per-service coverageThreshold gate defined in
      # package.json's "jest" block. Fails the build if any of the nine
      # core services drops below its configured threshold.
      - name: Unit tests with coverage
        run: npm run test:cov -- --ci

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build

  backend-e2e:
    name: Backend integration/e2e tests (hadoum_api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hadoum_api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: hadoum_ci_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d hadoum_ci_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/hadoum_ci_e2e
      JWT_SECRET: ci-e2e-placeholder-jwt-secret
      S3_ENDPOINT: https://example-object-storage.invalid
      S3_REGION: eu-central
      S3_ACCESS_KEY: ci-placeholder-access-key
      S3_SECRET_KEY: ci-placeholder-secret-key
      S3_BUCKET: ci-placeholder-bucket
      SMTP_USER: ci-placeholder@example.com
      SMTP_PASS: ci-placeholder-password
      FRONTEND_URL: https://example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hadoum_api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Formal migration workflow only — no "db push"/"migrate reset", per
      # the infrastructure job's forbidden-command check below.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Integration & e2e tests (Jest + Supertest, real Postgres)
        run: npm run test:e2e

  frontend:
    name: Frontend (hadoum_frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hadoum_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hadoum_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: Full-stack Playwright E2E (frontend + backend + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: hadoum_ci_playwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d hadoum_ci_playwright"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/hadoum_ci_playwright
      JWT_SECRET: ci-playwright-placeholder-jwt-secret
      S3_ENDPOINT: https://example-object-storage.invalid
      S3_REGION: eu-central
      S3_ACCESS_KEY: ci-placeholder-access-key
      S3_SECRET_KEY: ci-placeholder-secret-key
      S3_BUCKET: ci-placeholder-bucket
      SMTP_USER: ci-placeholder@example.com
      SMTP_PASS: ci-placeholder-password
      FRONTEND_URL: http://localhost:5173
      PORT: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: hadoum_api
        run: npm ci

      - name: Apply backend migrations
        working-directory: hadoum_api
        run: npx prisma migrate deploy

      - name: Build backend
        working-directory: hadoum_api
        run: npm run build

      - name: Start backend
        working-directory: hadoum_api
        run: |
          nohup node dist/main.js > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api >/dev/null && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          cat ../backend.log >&2
          exit 1

      # NOTE: the Playwright login/validation specs authenticate as the two
      # accounts prisma/seed.ts creates (hadoum@gmail.com / dounde.diallo@gmail.com,
      # overridable via E2E_DIRECTOR_EMAIL etc. — see hadoum_frontend/e2e/helpers.ts).
      # A migrated-but-empty CI database has neither account, so this step
      # seeds them before Playwright runs. See docs/testing.md.
      - name: Seed Playwright test accounts
        working-directory: hadoum_api
        run: npx ts-node prisma/seed.ts

      - name: Install frontend dependencies
        working-directory: hadoum_frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: hadoum_frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: hadoum_frontend
        env:
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: hadoum_frontend/playwright-report/
          retention-days: 14

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.local.yml
        run: docker compose -f docker-compose.local.yml config -q
        env:
          POSTGRES_USER: ci_local_user
          POSTGRES_PASSWORD: ci_local_placeholder_password
          POSTGRES_DB: ci_local_db
          DATABASE_URL: postgresql://ci_local_user:ci_local_placeholder_password@postgres:5432/ci_local_db
          JWT_SECRET: ci-local-placeholder-jwt-secret

      - name: Validate docker-compose.development.yml
        run: docker compose -f docker-compose.development.yml config -q
        env:
          POSTGRES_USER: ci_development_user
          POSTGRES_PASSWORD: ci_development_placeholder_password
          POSTGRES_DB: ci_development_db
          JWT_SECRET: ci-development-placeholder-jwt-secret

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          POSTGRES_USER: ci_prod_placeholder_user
          POSTGRES_PASSWORD: ci_prod_placeholder_password
          POSTGRES_DB: ci_prod_placeholder_db
          JWT_SECRET: ci-prod-placeholder-jwt-secret
          S3_ENDPOINT: https://example-object-storage.invalid
          S3_REGION: eu-central
          S3_ACCESS_KEY: ci-placeholder-access-key
          S3_SECRET_KEY: ci-placeholder-secret-key
          S3_BUCKET: ci-placeholder-bucket
          SMTP_USER: ci-placeholder@example.com
          SMTP_PASS: ci-placeholder-password
          FRONTEND_URL: https://example.invalid

      - name: Shell syntax check (scripts/)
        run: |
          set -eu
          find scripts hadoum_api/scripts -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
          echo "OK: all *.sh scripts passed bash -n."

      - name: Ensure no real .env file is committed
        run: |
          set -eu
          TRACKED_ENV_FILES=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '\.env\.example$|\.env\.local\.example$|\.env\.development\.example$|\.env\.dev\.example$|^hadoum_frontend/\.env\.production$' || true)
          if [ -n "$TRACKED_ENV_FILES" ]; then
            echo "Real .env file(s) are tracked in git:" >&2
            echo "$TRACKED_ENV_FILES" >&2
            exit 1
          fi
          echo "OK: no real .env file tracked (only *.example / hadoum_frontend/.env.production)."

      # "db push" and "migrate reset" are forbidden everywhere in executable
      # files. "migrate dev" is only forbidden in files that run in a
      # deployed environment (entrypoint.sh, Dockerfile, docker-compose.prod.yml,
      # docker-compose.development.yml) - it stays legitimate in local-only
      # tooling (scripts/local/*.sh, docker-compose.local.yml, Dockerfile.dev),
      # per docs/LOCAL_ENVIRONMENT.md.
      - name: Check for forbidden Prisma commands
        run: |
          set -eu
          FILES_ANYWHERE=$(grep -rlE 'db push|migrate reset' \
            --include="Dockerfile*" --include="*.sh" --include="docker-compose*.yml" --include="package.json" \
            --exclude-dir=node_modules --exclude-dir=.git . || true)

          PROD_FILES="hadoum_api/Dockerfile hadoum_api/entrypoint.sh docker-compose.prod.yml docker-compose.development.yml"
          FILES_PROD_MIGRATE_DEV=""
          for f in $PROD_FILES; do
            if [ -f "$f" ] && grep -qE 'migrate dev' "$f"; then
              FILES_PROD_MIGRATE_DEV="$FILES_PROD_MIGRATE_DEV $f"
            fi
          done

          if [ -n "$FILES_ANYWHERE" ] || [ -n "$FILES_PROD_MIGRATE_DEV" ]; then
            echo "Forbidden Prisma command(s) detected:" >&2
            [ -n "$FILES_ANYWHERE" ] && echo "  'db push' / 'migrate reset' in: $FILES_ANYWHERE" >&2
            [ -n "$FILES_PROD_MIGRATE_DEV" ] && echo "  'migrate dev' in production file(s): $FILES_PROD_MIGRATE_DEV" >&2
            exit 1
          fi
          echo "OK: no forbidden Prisma command in executable files."
