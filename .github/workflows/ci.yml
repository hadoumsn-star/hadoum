name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  api:
    name: API - lint, build, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hadoum_api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hadoum_api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Non-blocking on purpose: 8 pre-existing @typescript-eslint/no-unsafe-*
      # errors in children.service.ts, staff.service.ts and upload.service.ts
      # predate this workflow. Flip to blocking once fixed - see
      # docs/DEVELOPMENT_ENVIRONMENT.md. Uses lint:check (no --fix): CI must
      # verify, never silently rewrite source files.
      - name: Lint (non-blocking, known pre-existing errors)
        run: npm run lint:check
        continue-on-error: true

      - name: Build (tsc type-check via nest build)
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

  api-e2e:
    name: API - e2e tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: hadoum_api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: hadoum_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d hadoum_ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # CI-only, throwaway values. Never real/production secrets.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/hadoum_ci_db
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: eu-central
      S3_ACCESS_KEY: ci-test-access-key
      S3_SECRET_KEY: ci-test-secret-key
      S3_BUCKET: ci-test-bucket
      SMTP_USER: ci-test@example.com
      SMTP_PASS: ci-test-password
      FRONTEND_URL: http://localhost:5173
      PORT: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hadoum_api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations (prisma migrate deploy only - never db push/reset in CI)
        run: npx prisma migrate deploy

      - name: e2e tests
        run: npm run test:e2e

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hadoum_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hadoum_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Non-blocking on purpose: hadoum_frontend has no tsconfig.json/eslint
      # history, so tsc currently reports 8 pre-existing type errors
      # (ChildrenPage.tsx, DirectorDashboard.tsx, TeamPage.tsx). This step
      # surfaces them without failing the build until they're fixed.
      # Flip to blocking once fixed - see docs/DEVELOPMENT_ENVIRONMENT.md.
      - name: Typecheck (non-blocking, known pre-existing errors)
        run: npm run typecheck
        continue-on-error: true
