name: hadoum-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: hadoum-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hadoum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hadoum_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hadoum_user} -d ${POSTGRES_DB:-hadoum_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./hadoum_api
    container_name: hadoum-api-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hadoum_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hadoum_db}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-eu-central}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FRONTEND_URL: ${FRONTEND_URL:-https://hadoum.com}
      PORT: 3001
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./hadoum_frontend
    container_name: hadoum-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_prod_data:
    name: hadoum-postgres-prod-data