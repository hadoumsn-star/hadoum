name: hadoum-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: hadoum-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hadoum_user} -d ${POSTGRES_DB:-hadoum_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hadoum-network-prod

  api:
    build:
      context: ./hadoum_api
    image: ${API_IMAGE:-hadoum-api}:${IMAGE_TAG:-latest}
    container_name: hadoum-api-prod
    environment:
      NODE_ENV: production
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-hadoum_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hadoum_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env.prod}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required in .env.prod}
      S3_REGION: ${S3_REGION:-eu-central}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required in .env.prod}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required in .env.prod}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required in .env.prod}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://hadoum.com}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hadoum-network-prod

  frontend:
    build:
      context: ./hadoum_frontend
    image: ${FRONTEND_IMAGE:-hadoum-frontend}:${IMAGE_TAG:-latest}
    container_name: hadoum-frontend-prod
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-hadoum.com www.hadoum.com}
      NGINX_CERT_DOMAIN: ${NGINX_CERT_DOMAIN:-hadoum.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hadoum-network-prod

networks:
  hadoum-network-prod:
    name: hadoum-network-prod

volumes:
  postgres_prod_data:
    name: hadoum-postgres-prod-data
    external: true
