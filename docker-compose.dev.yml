name: hadoum-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: hadoum-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.dev}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.dev}
    ports:
      - "5432:5432"
    volumes:
      - hadoum_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hadoum_dev_user} -d ${POSTGRES_DB:-hadoum_dev_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hadoum-network-dev

  api:
    build:
      context: ./hadoum_api
      dockerfile: Dockerfile.dev
    container_name: hadoum-api-dev
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in .env.dev}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env.dev}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-eu-central}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3001:3001"
    volumes:
      - ./hadoum_api:/app
      - hadoum_api_dev_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hadoum-network-dev

  frontend:
    build:
      context: ./hadoum_frontend
      dockerfile: Dockerfile.dev
    container_name: hadoum-frontend-dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    ports:
      - "5173:5173"
    volumes:
      - ./hadoum_frontend:/app
      - hadoum_frontend_dev_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hadoum-network-dev

networks:
  hadoum-network-dev:
    name: hadoum-network-dev

volumes:
  hadoum_postgres_dev_data:
    name: hadoum-postgres-dev-data
  hadoum_api_dev_node_modules:
    name: hadoum-api-dev-node-modules
  hadoum_frontend_dev_node_modules:
    name: hadoum-frontend-dev-node-modules
