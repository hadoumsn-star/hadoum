name: hadoum-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: hadoum-postgres-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.local}
    ports:
      - "5432:5432"
    volumes:
      - hadoum_postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hadoum_dev_user} -d ${POSTGRES_DB:-hadoum_dev_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hadoum-network-local

  api:
    build:
      context: ./hadoum_api
      dockerfile: Dockerfile.dev
    container_name: hadoum-api-local
    environment:
      NODE_ENV: development
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in .env.local}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env.local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-eu-central}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3001:3001"
    volumes:
      - ./hadoum_api:/app
      - hadoum_api_local_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hadoum-network-local

  frontend:
    build:
      context: ./hadoum_frontend
      dockerfile: Dockerfile.dev
    container_name: hadoum-frontend-local
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    ports:
      - "5173:5173"
    volumes:
      - ./hadoum_frontend:/app
      - hadoum_frontend_local_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hadoum-network-local

networks:
  hadoum-network-local:
    name: hadoum-network-local

volumes:
  hadoum_postgres_local_data:
    name: hadoum-postgres-local-data
  hadoum_api_local_node_modules:
    name: hadoum-api-local-node-modules
  hadoum_frontend_local_node_modules:
    name: hadoum-frontend-local-node-modules
