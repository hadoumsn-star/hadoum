name: hadoum-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: hadoum-postgres-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.local}
    ports:
      - "5432:5432"
    volumes:
      - hadoum_postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hadoum_dev_user} -d ${POSTGRES_DB:-hadoum_dev_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hadoum-network-local

  # PR 19 (Module 5 stabilization) — optional local S3-compatible storage.
  # S3 is otherwise "optionnel en local" (see .env.local.example) and the
  # api container simply runs with uploads disabled if S3_* is left blank.
  # This service exists so a developer *can* opt in to real upload/PDF
  # coverage locally without touching UploadService or paying for/pointing
  # at the real Hetzner Object Storage bucket used in development/prod. Set
  # S3_ENDPOINT=http://minio:9000, S3_ACCESS_KEY/S3_SECRET_KEY to match
  # MINIO_ROOT_USER/MINIO_ROOT_PASSWORD below, and S3_BUCKET=hadoum-local in
  # .env.local to use it — the api container never talks to Hetzner then.
  minio:
    image: minio/minio:latest
    container_name: hadoum-minio-local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hadoum_dev_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hadoum_dev_minio_pw_local_only}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - hadoum_minio_local_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hadoum-network-local

  # One-shot: creates the hadoum-local bucket if it doesn't exist yet, then
  # exits. `docker compose up` runs it alongside the long-lived services;
  # its own exit code doesn't affect `api`/`frontend` (no `depends_on` from
  # them), so a fresh `minio` volume self-provisions its bucket without any
  # manual `mc mb` step.
  minio-init:
    image: minio/mc:latest
    container_name: hadoum-minio-init-local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-hadoum_dev_minio} ${MINIO_ROOT_PASSWORD:-hadoum_dev_minio_pw_local_only} &&
      mc mb --ignore-existing local/hadoum-local
      "
    networks:
      - hadoum-network-local

  api:
    build:
      context: ./hadoum_api
      dockerfile: Dockerfile.dev
    container_name: hadoum-api-local
    environment:
      NODE_ENV: development
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in .env.local}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env.local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-eu-central}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3001:3001"
    volumes:
      - ./hadoum_api:/app
      - hadoum_api_local_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hadoum-network-local

  frontend:
    build:
      context: ./hadoum_frontend
      dockerfile: Dockerfile.dev
    container_name: hadoum-frontend-local
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    ports:
      - "5173:5173"
    volumes:
      - ./hadoum_frontend:/app
      - hadoum_frontend_local_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hadoum-network-local

networks:
  hadoum-network-local:
    name: hadoum-network-local

volumes:
  hadoum_postgres_local_data:
    name: hadoum-postgres-local-data
  hadoum_minio_local_data:
    name: hadoum-minio-local-data
  hadoum_api_local_node_modules:
    name: hadoum-api-local-node-modules
  hadoum_frontend_local_node_modules:
    name: hadoum-frontend-local-node-modules
